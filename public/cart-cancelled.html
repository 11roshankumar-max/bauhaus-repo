<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout cancelled — Taana Baana</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Work+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#12163a; --panel:#191f4c; --ivory:#f4ede0; --dim:#c9c0ab; --marigold:#e7a542; --ink:#181307; }
  body{ margin:0; min-height:100vh; background:var(--bg); color:var(--ivory); font-family:'Work Sans',sans-serif;
    display:flex; align-items:center; justify-content:center; padding:24px; }
  .card{ max-width:480px; text-align:center; background:var(--panel); border:1px solid rgba(244,237,224,0.14); border-radius:4px; padding:44px; }
  h1{ font-family:'Fraunces',serif; font-weight:600; font-size:1.6rem; margin:0 0 10px; }
  p{ color:var(--dim); }
  a.btn{ display:inline-block; margin-top:20px; font-size:0.85rem; letter-spacing:0.04em;
    padding:12px 22px; border:1px solid var(--marigold); color:var(--ivory); text-decoration:none; border-radius:2px; }
  a.btn:hover{ background:var(--marigold); color:var(--ink); }
</style>
</head>
<body>
  <div class="card">
    <h1>Checkout cancelled</h1>
    <p>No payment was made. Your cart is still saved if you'd like to try again.</p>
    <a class="btn" href="/">&larr; Back to the map</a>
  </div>
</body>
</html>
